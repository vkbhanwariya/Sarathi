# Sarathi - Canonical Runtime Settings Configuration
# Sutra Configuration System

[storage]
input_root = "Input"
output_root = "Output"
runtime_root = "Runtime"

[pipeline]
max_retries = 0

[security]
allow_pii_access = false
allow_network_access = false
allow_external_processing = false
allowed_secrets = [
    "MISTRAL_API_KEY",
]

[telemetry]
history_enabled = false
live_buffer_capacity = 256
history_path = "history.jsonl"

[hardware]
detect_accelerators = true
gpu_capacity_per_device = 2
cpu_capacity = 6

[mistral]
model_ocr = "mistral-ocr-latest"
timeout_seconds = 60
rate_limit_delay_seconds = 2.0

[limits]
max_input_bytes = 524288000
max_uncompressed_bytes = 1073741824
max_compression_ratio = 200.0
max_zip_members = 10000
