# Punjab National Bank (PNB) Statement Profile
profile_id: "pnb"
bank_name: "Punjab National Bank"
aliases:
  - "punjab national bank"
  - "pnb"

identification_keywords:
  - "punjab national bank"
  - "pnb"
  - "pnbindia.in"
  - "pnb net banking"

headers:
  date:
    - "txn date"
    - "transaction date"
    - "post date"
    - "date"
  description:
    - "transaction details"
    - "particulars"
    - "description"
    - "narration"
  reference_number:
    - "cheque no."
    - "chq no"
    - "ref no"
    - "utr"
  debit:
    - "debit"
    - "withdrawal"
    - "dr"
    - "withdrawal amount"
  credit:
    - "credit"
    - "deposit"
    - "cr"
    - "deposit amount"
  balance:
    - "balance"
    - "balance (inr)"
    - "closing balance"

date_formats:
  - "%d/%m/%Y"
  - "%d-%m-%Y"
  - "%d-%b-%Y"

metadata_patterns:
  account_number: '(?:Account\s*(?:Number|No\.?)?|A/c\s*No\.?)\s*[:\-]?\s*([0-9Xx\*]{16})'
  account_holder: '(?:Name|Customer\s*Name|A/c\s*Name)\s*[:\-]?\s*([^\n]+)'
  ifsc: 'IFSC(?:\s*Code)?\s*[:\-]?\s*(PUNB0[A-Z0-9]{6})'
  cust_id: '(?:Cust\s*ID|Customer\s*ID)\s*[:\-]?\s*([0-9A-Z]{7,10})'
