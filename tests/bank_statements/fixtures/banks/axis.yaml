# Axis Bank Statement Profile
profile_id: "axis"
bank_name: "Axis Bank"
aliases:
  - "axis bank"
  - "axis"
  - "axisbank"
  - "uti bank"

identification_keywords:
  - "axis bank"
  - "axisbank"
  - "axisbank.com"
  - "utib"

headers:
  date:
    - "tran date"
    - "transaction date"
    - "date"
  description:
    - "particulars"
    - "tran particulars"
    - "narration"
    - "description"
  reference_number:
    - "chq no"
    - "chq no."
    - "cheque no"
    - "ref no"
    - "utr"
  debit:
    - "debit"
    - "dr"
    - "withdrawal"
    - "debit amount"
  credit:
    - "credit"
    - "cr"
    - "deposit"
    - "credit amount"
  balance:
    - "balance"
    - "running balance"
    - "balance (inr)"

date_formats:
  - "%d-%m-%Y"
  - "%d/%m/%Y"
  - "%d %b %Y"

metadata_patterns:
  account_number: '(?:Account\s*(?:Number|No\.?)?|A/c\s*No\.?)\s*[:\-]?\s*([0-9Xx\*]{15})'
  account_holder: '(?:Name|Account\s*Name|Mr\.|Ms\.|M/s)\s*[:\-]?\s*([^\n]+)'
  ifsc: 'IFSC(?:\s*Code)?\s*[:\-]?\s*(UTIB0[A-Z0-9]{6})'
  customer_id: '(?:Cust\s*ID|Customer\s*ID)\s*[:\-]?\s*([0-9]{9})'
