name: Starlette cleanup sync

on:
  push:
    branches: [v3-mukha-starlette]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-mukha-starlette
          fetch-depth: 0

      - name: Remove legacy HTTP handler machinery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runner = Path('src/sarathi/mukha/web/runner.py')
          text = runner.read_text(encoding='utf-8')
          text = text.replace('from dataclasses import dataclass\n', 'from dataclasses import dataclass\nfrom enum import StrEnum\n')
          text = text.replace(
              '''from sarathi.mukha.web.http_handler import (\n    StartRunResponse,\n    StartRunStatus,\n    _format_public_error,\n)\n''',
              'from sarathi.mukha.web.security import _format_public_error\n',
          )
          anchor = '''@dataclass(frozen=True, slots=True)\nclass ActiveRunSnapshot:\n'''
          contracts = '''class StartRunStatus(StrEnum):\n    """Result status of an attempt to start an interactive run."""\n\n    OK = "ok"\n    BUSY = "busy"\n    INVALID_INPUTS = "invalid_inputs"\n\n\n@dataclass(frozen=True, slots=True)\nclass StartRunResponse:\n    """Typed result of an attempt to start an interactive run."""\n\n    status: StartRunStatus\n    run_id: str | None = None\n    error_message: str | None = None\n\n\n'''
          if contracts not in text:
              text = text.replace(anchor, contracts + anchor)
          runner.write_text(text, encoding='utf-8')

          app = Path('src/sarathi/mukha/web/app.py')
          text = app.read_text(encoding='utf-8').replace(
              'from sarathi.mukha.web.http_handler import StartRunStatus\n',
              'from sarathi.mukha.web.runner import StartRunStatus\n',
          )
          app.write_text(text, encoding='utf-8')

          server = Path('src/sarathi/mukha/web/server.py')
          text = server.read_text(encoding='utf-8')
          text = text.replace('from sarathi.mukha.web.http_handler import StartRunResponse\n', '')
          text = text.replace(
              'from sarathi.mukha.web.runner import RunCoordinator\n',
              'from sarathi.mukha.web.runner import RunCoordinator, StartRunResponse\n',
          )
          server.write_text(text, encoding='utf-8')

          security_test = Path('tests/mukha/test_security_headers_and_host.py')
          text = security_test.read_text(encoding='utf-8').replace(
              'from sarathi.mukha.web.http_handler import (\n',
              'from sarathi.mukha.web.security import (\n',
          )
          security_test.write_text(text, encoding='utf-8')

          preview = Path('src/sarathi/mukha/web/preview.py')
          text = preview.read_text(encoding='utf-8')
          text = re.sub(
              r'\n\ndef stream_raw_document\(.*?\n\ndef _extract_docx_preview',
              '\n\ndef _extract_docx_preview',
              text,
              flags=re.S,
          )
          text = re.sub(r'\n\ndef stream_confirmed_artifact\(.*\Z', '\n', text, flags=re.S)
          text = text.replace('import mimetypes\n', '')
          preview.write_text(text, encoding='utf-8')

          review = Path('src/sarathi/mukha/web/review_handler.py')
          text = review.read_text(encoding='utf-8')
          text = re.sub(r'\n\ndef handle_review_post\(.*\Z', '\n', text, flags=re.S)
          review.write_text(text, encoding='utf-8')

          architecture_test = Path('tests/architecture/test_mukha_transport.py')
          architecture_test.write_text(
              '''"""Mukha V3 transport boundary regressions."""\n\nfrom pathlib import Path\n\n\ndef test_mukha_uses_asgi_transport_without_custom_http_server() -> None:\n    web_root = Path("src/sarathi/mukha/web")\n    source = "\\n".join(\n        path.read_text(encoding="utf-8")\n        for path in web_root.glob("*.py")\n    )\n    for forbidden in (\n        "BaseHTTPRequestHandler",\n        "ThreadingHTTPServer",\n        "from http.server",\n        "handler.wfile",\n        "handler.send_response",\n    ):\n        assert forbidden not in source\n\n    assert not (web_root / "http_handler.py").exists()\n    assert not (web_root / "static_handler.py").exists()\n''',
              encoding='utf-8',
          )
          PY

          git rm src/sarathi/mukha/web/http_handler.py
          git rm src/sarathi/mukha/web/static_handler.py

          if git grep -n -E 'sarathi\.mukha\.web\.http_handler|static_handler|stream_raw_document|stream_confirmed_artifact|handle_review_post|MukhaHTTPHandler|ThreadingHTTPServer|BaseHTTPRequestHandler' -- src tests; then
            echo 'Legacy transport reference remains.' >&2
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git rm .github/workflows/starlette-cleanup-sync.yml
          git commit -m "Remove legacy Mukha HTTP server machinery"
          git push origin HEAD:v3-mukha-starlette
