name: Phase 0 tidy sync

on:
  push:
    branches:
      - cleanup-mukha-starlette-phase0

permissions:
  contents: write

jobs:
  tidy:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Canonicalize imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/sarathi/mukha/web/app.py')
          text = path.read_text(encoding='utf-8')
          old = '''from sarathi.mukha.presenter import MukhaPresenter\nfrom sarathi.mukha.web.runner import StartRunStatus\nfrom sarathi.mukha.web.native_picker import NativePicker\nfrom sarathi.mukha.web.preview import (\n'''
          new = '''from sarathi.mukha.presenter import MukhaPresenter\nfrom sarathi.mukha.web.native_picker import NativePicker\nfrom sarathi.mukha.web.preview import (\n'''
          if old not in text:
              raise SystemExit('expected import block not found')
          text = text.replace(old, new, 1)
          marker = 'from sarathi.mukha.web.review_handler import parse_and_validate_review_intent\n'
          if marker not in text:
              raise SystemExit('review import marker not found')
          text = text.replace(marker, marker + 'from sarathi.mukha.web.runner import StartRunStatus\n', 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/phase0-tidy-sync.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tidy Mukha Starlette cleanup"
          git push origin HEAD:cleanup-mukha-starlette-phase0
