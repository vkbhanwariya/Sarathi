name: Phase 0 Mukha cleanup sync

on:
  push:
    branches:
      - cleanup-mukha-starlette-phase0

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove obsolete HTTP handler machinery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          web = root / 'src/sarathi/mukha/web'

          # Run-start contracts belong to the run coordinator, not HTTP transport.
          runner_path = web / 'runner.py'
          runner = runner_path.read_text(encoding='utf-8')
          runner = runner.replace(
              '"""Mukha Interactive Run Coordinator and Worker Lifecycle for Sarathi V2.',
              '"""Mukha Interactive Run Coordinator and Worker Lifecycle for Sarathi V3.',
              1,
          )
          if 'from enum import StrEnum\n' not in runner:
              runner = runner.replace('from dataclasses import dataclass\n', 'from dataclasses import dataclass\nfrom enum import StrEnum\n', 1)
          old_import = '''from sarathi.mukha.web.http_handler import (\n    StartRunResponse,\n    StartRunStatus,\n    _format_public_error,\n)\n'''
          if old_import not in runner:
              raise SystemExit('expected http_handler import not found in runner.py')
          runner = runner.replace(old_import, 'from sarathi.mukha.web.security import _format_public_error\n', 1)
          marker = 'if TYPE_CHECKING:\n    from sarathi.agni import Agni\n\n\n'
          contracts = '''class StartRunStatus(StrEnum):\n    """Result status of an attempt to start an interactive run."""\n\n    OK = "ok"\n    BUSY = "busy"\n    INVALID_INPUTS = "invalid_inputs"\n\n\n@dataclass(frozen=True, slots=True)\nclass StartRunResponse:\n    """Typed result of an attempt to start an interactive run."""\n\n    status: StartRunStatus\n    run_id: str | None = None\n    error_message: str | None = None\n\n\n'''
          if marker not in runner:
              raise SystemExit('runner.py insertion marker not found')
          runner = runner.replace(marker, marker + contracts, 1)
          runner_path.write_text(runner, encoding='utf-8')

          # Starlette route translation imports the contract from its actual owner.
          app_path = web / 'app.py'
          app = app_path.read_text(encoding='utf-8')
          old = 'from sarathi.mukha.web.http_handler import StartRunStatus\n'
          if old not in app:
              raise SystemExit('expected http_handler import not found in app.py')
          app = app.replace(old, 'from sarathi.mukha.web.runner import StartRunStatus\n', 1)
          app_path.write_text(app, encoding='utf-8')

          # Keep preview extraction; remove old BaseHTTPRequestHandler-style streaming wrappers.
          preview_path = web / 'preview.py'
          preview = preview_path.read_text(encoding='utf-8')
          preview, n1 = re.subn(
              r'\n\ndef stream_raw_document\(.*?(?=\n\ndef _extract_docx_preview)',
              '',
              preview,
              count=1,
              flags=re.S,
          )
          preview, n2 = re.subn(
              r'\n\ndef stream_confirmed_artifact\(.*\Z',
              '',
              preview,
              count=1,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'preview wrapper removal mismatch: raw={n1}, artifact={n2}')
          preview_path.write_text(preview.rstrip() + '\n', encoding='utf-8')

          # Keep payload validation; remove old handler dispatch wrapper.
          review_path = web / 'review_handler.py'
          review = review_path.read_text(encoding='utf-8')
          review, n = re.subn(r'\n\ndef handle_review_post\(.*\Z', '', review, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('review handler wrapper removal mismatch')
          review_path.write_text(review.rstrip() + '\n', encoding='utf-8')

          # Old transport shells are now dead.
          for obsolete in (web / 'http_handler.py', web / 'static_handler.py'):
              if not obsolete.exists():
                  raise SystemExit(f'expected obsolete module missing before cleanup: {obsolete}')
              obsolete.unlink()

          # Architecture regression: stdlib handler transport must not return to Mukha.
          test_path = root / 'tests/architecture/test_mukha_transport.py'
          test_path.write_text('''"""Architecture gates for the Mukha ASGI transport boundary."""\n\nfrom pathlib import Path\n\n\n_WEB_ROOT = Path(__file__).resolve().parents[2] / "src" / "sarathi" / "mukha" / "web"\n\n\ndef test_obsolete_http_handler_modules_are_absent() -> None:\n    assert not (_WEB_ROOT / "http_handler.py").exists()\n    assert not (_WEB_ROOT / "static_handler.py").exists()\n\n\ndef test_mukha_has_no_stdlib_handler_transport() -> None:\n    forbidden = (\n        "from http.server",\n        "import http.server",\n        "BaseHTTPRequestHandler",\n        "ThreadingHTTPServer",\n        ".send_response(",\n        ".send_header(",\n        ".end_headers(",\n        ".wfile",\n    )\n    offenders: list[str] = []\n    for path in sorted(_WEB_ROOT.rglob("*.py")):\n        text = path.read_text(encoding="utf-8")\n        for token in forbidden:\n            if token in text:\n                offenders.append(f"{path.relative_to(_WEB_ROOT)}: {token}")\n    assert not offenders, "obsolete HTTP handler transport remains: " + ", ".join(offenders)\n''', encoding='utf-8')

          # Correct the roadmap target: planning/execution remain explicit responsibilities.
          veda_path = root / 'Vedas/Sarathi_V3_Cleanup_Optimization_Plan.md'
          veda = veda_path.read_text(encoding='utf-8')
          old_target = '''Nabhi\n  registry + planning + pipeline execution\n'''
          new_target = '''Kosh\n  registry + declarations\n\nManthan\n  planning\n\nPravaha\n  pipeline execution\n'''
          if old_target not in veda:
              raise SystemExit('expected Nabhi target block not found in cleanup Veda')
          veda = veda.replace(old_target, new_target, 1)
          veda_path.write_text(veda, encoding='utf-8')

          # Remove this one-shot workflow from the resulting branch commit.
          Path('.github/workflows/phase0-cleanup-sync.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish Mukha Starlette transport cleanup"
          git push origin HEAD:cleanup-mukha-starlette-phase0
