name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    name: Lint & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Bytecode compilation check
        run: uv run python -m compileall -q src tests scripts

      - name: Ruff lint check
        run: uv run ruff check .

  architecture:
    name: Architecture Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run architecture tests only
        run: uv run --group dev pytest -q tests/architecture

  frontend:
    name: Mukha UI TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Typecheck and build Mukha UI
        run: npm run build

  test:
    name: Unit & Integration Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Verify headless OpenCV resolution (temporary)
        run: |
          .venv/bin/python - <<'PY'
          from importlib import metadata
          import cv2

          installed = {dist.metadata['Name'].lower() for dist in metadata.distributions()}
          assert 'opencv-python-headless' in installed
          assert 'opencv-python' not in installed
          print(f"OpenCV {cv2.__version__}: headless-only dependency graph verified")
          PY

      - name: Upload Phase 10 lockfile (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: phase10-uv-lock
          path: uv.lock

      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Provision verified OCR models
        shell: pwsh
        run: ./scripts/Setup-OCRModels.ps1

      - name: Phase 10 OCR import profile (temporary)
        run: |
          .venv/bin/python - <<'PY'
          from __future__ import annotations

          import statistics
          import subprocess
          import sys
          import time

          cases = {
              "import_ocr_capability": "import sarathi.shakti.ocr.capability",
              "import_ocr_engine_facade": "import sarathi.shakti.ocr.engine",
              "import_ocr_coordinator": "import sarathi.shakti.ocr.engine.coordinator",
              "import_ocr_factory": "import sarathi.shakti.ocr.engine.factory",
              "import_ocr_openvino": "import sarathi.shakti.ocr.engine.openvino",
              "import_ocr_parser": "import sarathi.shakti.ocr.engine.parser",
              "import_ocr_readiness": "import sarathi.shakti.ocr.engine.readiness",
              "import_ocr_tesseract": "import sarathi.shakti.ocr.engine.tesseract",
              "import_docx_exporter": "import sarathi.shakti.docx_exporter",
              "agni_bootstrap": """
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from sarathi.agni import Agni

          with TemporaryDirectory() as td:
              root = Path(td)
              input_root = root / "input"
              runtime_root = root / "runtime"
              output_root = root / "output"
              input_root.mkdir()
              runtime_root.mkdir()
              output_root.mkdir()
              with Agni(input_root=input_root, runtime_root=runtime_root, output_root=output_root):
                  pass
          """,
          }

          for name, code in cases.items():
              samples = []
              for _ in range(5):
                  started = time.perf_counter()
                  subprocess.run(
                      [sys.executable, "-c", code],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  samples.append((time.perf_counter() - started) * 1000.0)
              rounded = ",".join(f"{value:.1f}" for value in samples)
              print(f"PHASE10 {name} median_ms={statistics.median(samples):.1f} samples_ms={rounded}")
          PY

      - name: Run deterministic test suite
        run: uv run --group dev --all-extras pytest -q -m "not browser and not performance and not real_model and not architecture"

  browser:
    name: Browser Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Provision verified OCR models
        shell: pwsh
        run: ./scripts/Setup-OCRModels.ps1

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run browser test suite
        run: uv run --group dev --all-extras pytest -q -m browser
