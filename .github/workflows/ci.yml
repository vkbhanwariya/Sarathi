name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Bytecode compilation check
        run: uv run python -m compileall -q src tests tools

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Architecture manifest validation
        run: uv run python -m tools.architecture.validate_manifest

      - name: Import Linter check
        run: uv run lint-imports

      - name: Architecture tests (fast fail)
        run: uv run --group dev pytest -q -m architecture

      - name: Run full test suite
        run: uv run --group dev --all-extras pytest -q
