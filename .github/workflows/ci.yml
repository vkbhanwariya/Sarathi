name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Bytecode compilation check
        run: uv run python -m compileall -q src tests scripts

      - name: Ruff lint check
        run: uv run ruff check .

  architecture:
    name: Architecture Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run architecture tests only
        run: uv run --group dev pytest -q tests/architecture

  frontend:
    name: Mukha UI TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Typecheck and build Mukha UI
        run: npm run build

      - name: Package and switch Mukha UI
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p src/sarathi/mukha/web/ui
          cp ui/dist/index.html src/sarathi/mukha/web/ui/index.html
          cp ui/dist/app.js src/sarathi/mukha/web/ui/app.js
          cp ui/dist/app.css src/sarathi/mukha/web/ui/app.css
          python - <<'PY'
          from pathlib import Path

          path = Path("src/sarathi/mukha/web/app.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        return _static_response("app.html", "text/html")',
              '        return _static_response("ui/index.html", "text/html")',
          )
          if "async def ui_asset(" not in text:
              marker = '''    async def packaged_asset(request: Request) -> Response:\n'''
              ui_block = '''    async def ui_asset(request: Request) -> Response:\n        name = request.path_params["path"]\n        if name not in {"app.js", "app.css"}:\n            return Response("UI asset not found.", status_code=404)\n        mime = "application/javascript" if name.endswith(".js") else "text/css"\n        return _static_response(f"ui/{name}", mime, "public, max-age=3600")\n\n'''
              if marker not in text:
                  raise SystemExit("packaged asset insertion point not found")
              text = text.replace(marker, ui_block + marker, 1)
          route_marker = '        Route("/index.html", root),\n'
          ui_route = '        Route("/ui/{path:path}", ui_asset),\n'
          if ui_route not in text:
              if route_marker not in text:
                  raise SystemExit("route insertion point not found")
              text = text.replace(route_marker, route_marker + ui_route, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git add src/sarathi/mukha/web/ui src/sarathi/mukha/web/app.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Switch Phase 11 Preact production UI"
          git push origin HEAD:development

  test:
    name: Unit & Integration Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Provision verified OCR models
        shell: pwsh
        run: ./scripts/Setup-OCRModels.ps1

      - name: Run deterministic test suite
        run: uv run --group dev --all-extras pytest -q -m "not browser and not performance and not real_model and not architecture"

  browser:
    name: Browser Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Provision verified OCR models
        shell: pwsh
        run: ./scripts/Setup-OCRModels.ps1

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run browser test suite
        run: uv run --group dev --all-extras pytest -q -m browser
