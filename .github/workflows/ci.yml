name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

jobs:
  lint:
    name: Lint & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Bytecode compilation check
        run: uv run python -m compileall -q src tests scripts

      - name: Ruff lint check
        run: uv run ruff check .

  architecture:
    name: Architecture Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run architecture tests only
        run: uv run --group dev pytest -q tests/architecture

  test:
    name: Unit & Integration Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Provision verified OCR models
        run: uv run python scripts/setup_ocr_models.py --download

      - name: Run deterministic tests
        run: uv run --all-extras --group dev pytest -q -m "not browser and not real_model and not performance"

  browser:
    name: Browser Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin

      - name: Provision verified OCR models
        run: uv run python scripts/setup_ocr_models.py --download

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run browser tests
        run: uv run --all-extras --group dev pytest -q -m browser
