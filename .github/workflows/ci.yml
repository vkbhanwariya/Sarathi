name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Bytecode compilation check
        run: uv run python -m compileall -q src tests scripts

      - name: Ruff lint check
        run: uv run ruff check .

  architecture:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Architecture tests (manifest & import linter)
        run: uv run --group dev pytest -q -m architecture

  test:
    name: Unit & Integration Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Run deterministic test suite
        run: uv run --group dev --all-extras pytest -q -m "not browser and not performance and not real_model and not architecture"

  browser:
    name: Browser Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run browser test suite
        run: uv run --group dev pytest -q -m browser
