[project]
name = "sarathi"
version = "2.0.0"
description = "Local, plugin-first document intelligence system"
requires-python = "==3.13.15"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.1",
    "openpyxl>=3.1.5",
    "polars>=1.44.1",
    "pymupdf>=1.28.2",
    "python-calamine>=0.8.2",
    "textual>=8.2.8",
    "xlrd>=2.0.2",
]


[project.scripts]
sarathi = "sarathi.__main__:main"

[project.optional-dependencies]
ocr = [
    "numpy>=2.0.0",
    "openvino>=2025.0.0",
    "pillow>=11.0.0",
    "rapidocr>=3.9.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
