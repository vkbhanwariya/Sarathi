[project]
name = "sarathi"
version = "2.0.0"
description = "Local, plugin-first document intelligence system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.1",
    "openpyxl>=3.1.5",
    "polars>=1.44.1",
    "pymupdf>=1.28.2",
    "python-calamine>=0.8.2",
    "pyyaml>=6.0.2",
    "xlrd>=2.0.2",
]


[project.scripts]
sarathi = "sarathi.__main__:main"

[project.optional-dependencies]
ocr = [
    "numpy>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "openvino>=2025.0.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.9.0",
]
translation = [
    "ctranslate2>=4.5.0",
    "regex>=2024.11.6",
    "sentencepiece>=0.2.0",
]
font_conversion = [
    "regex>=2024.11.6",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "jsonschema>=4.20.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.7.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --tb=short --show-capture=no"
markers = [
    "unit: marks isolated deterministic unit tests",
    "contract: marks public data or API contract tests",
    "integration: marks multi-component runtime integration tests",
    "browser: marks Playwright browser interaction tests",
    "architecture: marks architectural fitness functions and structural dependency invariants",
    "performance: marks wall-clock timing or scalability benchmarks",
    "real_model: marks tests that require downloading or running real neural model weights (deselect with '-m \"not real_model\"')",
    "model_asset: marks tests that require local model asset files",
    "slow: marks intentionally slower integration or end-to-end tests",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.importlinter]
root_packages = ["sarathi"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Sankalpa is foundational"
type = "forbidden"
source_modules = ["sarathi.sankalpa"]
forbidden_modules = [
    "sarathi.agni",
    "sarathi.darpana",
    "sarathi.kavacha",
    "sarathi.mukha",
    "sarathi.nabhi",
    "sarathi.shakti",
    "sarathi.smriti",
    "sarathi.sutra",
    "sarathi.yantra",
]

[[tool.importlinter.contracts]]
name = "Shakti plugins are independent siblings"
type = "independence"
modules = [
    "sarathi.shakti.bank_statements",
    "sarathi.shakti.darshana",
    "sarathi.shakti.font_conversion",
    "sarathi.shakti.native_extraction",
    "sarathi.shakti.ocr",
    "sarathi.shakti.translation",
]

[[tool.importlinter.contracts]]
name = "Generic Nabhi does not import concrete capabilities"
type = "forbidden"
source_modules = ["sarathi.nabhi"]
forbidden_modules = [
    "sarathi.shakti.bank_statements",
    "sarathi.shakti.darshana",
    "sarathi.shakti.font_conversion",
    "sarathi.shakti.native_extraction",
    "sarathi.shakti.ocr",
    "sarathi.shakti.translation",
]
ignore_imports = [
    "sarathi.nabhi.dvara -> sarathi.shakti.providers",
]

[[tool.importlinter.contracts]]
name = "Mukha does not import concrete capabilities or provider catalog"
type = "forbidden"
source_modules = ["sarathi.mukha"]
forbidden_modules = [
    "sarathi.shakti.bank_statements",
    "sarathi.shakti.darshana",
    "sarathi.shakti.font_conversion",
    "sarathi.shakti.native_extraction",
    "sarathi.shakti.ocr",
    "sarathi.shakti.translation",
    "sarathi.shakti.providers",
]
