[project]
name = "sarathi"
version = "1.0.0"
description = "Local document intelligence system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.1",
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "orjson>=3.12.0",
    "polars>=1.44.2",
    "pymupdf==1.28.2",
    "python-calamine>=0.8.2",
    "pyyaml>=6.0.3",
    "starlette>=1.6.0,<2",
    "uvicorn>=0.54.0,<0.55",
    "xlrd>=2.0.2",
]

[project.scripts]
sarathi = "sarathi.__main__:main"

[project.optional-dependencies]
ocr = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0,<5.1.0",
    "openvino>=2026.4.0",
    "pillow>=12.3.0",
    "rapidocr>=3.9.2",
]
translation = [
    "ctranslate2>=4.8.2",
    "sentencepiece>=0.2.2",
]
font_conversion = [
    "fonttools>=4.65.0",
    "rapidfuzz>=3.14.6",
    "regex>=2026.9.10",
]
layout = [
    "xberg>=1.2.9",
]
cloud = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-dependencies = [
    { package = { name = "rapidocr" }, dependencies = ["opencv-python"] },
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "py-spy>=0.4.2",
    "ruff>=0.16.9",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --tb=short --show-capture=no -p no:warnings -m \"not browser and not performance and not real_model and not layout\""
markers = [
    "unit: marks isolated deterministic unit tests",
    "contract: marks public data or API contract tests",
    "integration: marks multi-component runtime integration tests",
    "browser: marks Playwright browser interaction tests",
    "architecture: marks lightweight architecture sanity checks",
    "performance: marks wall-clock timing or scalability benchmarks",
    "real_model: marks tests that require downloading or running real neural model weights (deselect with '-m \"not real_model\"')",
    "model_asset: marks tests that require local model asset files",
    "slow: marks intentionally slower integration or end-to-end tests",
    "layout: marks layout analysis tests",
]

[tool.ruff]
target-version = "py313"
line-length = 120
output-format = "concise"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sarathi"]
