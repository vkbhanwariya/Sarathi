      <rect fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="9" y="9" width="6" height="6"></rect>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="9" y1="1" x2="9" y2="4"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="15" y1="1" x2="15" y2="4"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="9" y1="20" x2="9" y2="23"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="15" y1="20" x2="15" y2="23"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="20" y1="9" x2="23" y2="9"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="20" y1="15" x2="23" y2="15"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="1" y1="9" x2="4" y2="9"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="1" y1="15" x2="4" y2="15"></line>
    </g>
  </defs>
</svg>
