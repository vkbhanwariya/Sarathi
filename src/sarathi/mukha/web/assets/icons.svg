<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Document Icon -->
    <g id="icon-file">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="14 2 14 8 20 8"></polyline>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="16" y1="13" x2="8" y2="13"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="16" y1="17" x2="8" y2="17"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="10" y1="9" x2="8" y2="9"></line>
    </g>

    <!-- Folder Icon -->
    <g id="icon-folder">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
    </g>

    <!-- Play / Run Icon -->
    <g id="icon-play">
      <polygon fill="currentColor" points="5 3 19 12 5 21 5 3"></polygon>
    </g>

    <!-- Stop / Cancel Icon -->
    <g id="icon-stop">
      <rect fill="currentColor" x="4" y="4" width="16" height="16" rx="2"></rect>
    </g>

    <!-- Eye / Preview Icon -->
    <g id="icon-preview">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" cx="12" cy="12" r="3"></circle>
    </g>

    <!-- Check / Success Icon -->
    <g id="icon-check">
      <polyline fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="20 6 9 17 4 12"></polyline>
    </g>

    <!-- Alert / Warning Icon -->
    <g id="icon-alert">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="12" y1="9" x2="12" y2="13"></line>
      <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x1="12" y1="17" x2="12.01" y2="17"></line>
    </g>

    <!-- Search Icon -->
