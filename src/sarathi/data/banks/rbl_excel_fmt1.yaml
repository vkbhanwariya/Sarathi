profile_id: "rbl_excel_fmt1"
parent_bank: "rbl"
bank_name: "RBL Bank Limited"
container_format: "excel"
layout_variant: "fmt1"

file_format:
  declared_extension: ".xlsx"
  actual_hidden_format: "openxml_spreadsheet"
  mime_type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

aliases:
  - "rbl"
  - "rbl bank"
  - "rbl bank limited"

identification_keywords:
  - "rbl bank"
  - "rbl bank limited"
  - "rbl"
  - "ratn"

headers:
  cheque_number:
    - "instrmnt_num"
  date:
    - "tran_date"
  reference_number:
    - "tran_id"
  description:
    - "tran_particular"
  credit:
    - "credit_amount"
  debit:
    - "debit_amount"
  balance:
    - "balance"

date_formats:
  - "%Y-%m-%d"
  - "%d-%m-%Y"
  - "%d/%m/%Y"

signed_amounts: false
negative_debits: true

metadata_patterns:
  account_number: '(?:account_no|Account\s*No)\s*[:\-]?\s*([0-9]{12})'

layout_signature:
  header_row:
    expected: 0
    tolerance: 0
    bonus: 1.0
  column_count:
    expected: 8
    tolerance: 0
    bonus: 2.0
  sequence:
    expected:
      - cheque_number
      - date
      - reference_number
      - description
      - credit
      - debit
      - balance
    weight: 3.0
