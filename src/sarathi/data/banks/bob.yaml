# Bank of Baroda (BOB) Statement Profile
profile_id: "bob"
bank_name: "Bank of Baroda"
aliases:
  - "bank of baroda"
  - "bob"
  - "baroda"

identification_keywords:
  - "bank of baroda"
  - "bob"
  - "bankofbaroda.in"
  - "baroda connect"

headers:
  date:
    - "date"
    - "value date"
    - "txn date"
  description:
    - "narration"
    - "description"
    - "particulars"
  reference_number:
    - "chq/ref no"
    - "chq/ref.no."
    - "cheque no"
    - "utr"
  debit:
    - "withdrawal"
    - "debit"
    - "dr"
    - "withdrawal amt"
  credit:
    - "deposit"
    - "credit"
    - "cr"
    - "deposit amt"
  balance:
    - "balance"
    - "balance (inr)"
    - "closing balance"

date_formats:
  - "%d-%m-%Y"
  - "%d/%m/%Y"
  - "%d %b %Y"

metadata_patterns:
  account_number: '(?:Account\s*(?:Number|No\.?)?|A/c\s*No\.?)\s*[:\-]?\s*([0-9Xx\*]{14})'
  account_holder: '(?:Name|Account\s*Name|Customer\s*Name)\s*[:\-]?\s*([^\n]+)'
  ifsc: 'IFSC(?:\s*Code)?\s*[:\-]?\s*(BARB0[A-Z0-9]{6})'
  customer_id: '(?:Cust\s*ID|Customer\s*ID)\s*[:\-]?\s*([0-9]{9})'
