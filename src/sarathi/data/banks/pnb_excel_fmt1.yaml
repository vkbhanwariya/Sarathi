profile_id: "pnb_excel_fmt1"
parent_bank: "pnb"
bank_name: "Punjab National Bank"
container_format: "excel"
layout_variant: "fmt1"

file_format:
  declared_extension: ".xlsx"
  actual_hidden_format: "openxml_spreadsheet"
  mime_type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

aliases:
  - "pnb"
  - "punjab national bank"

identification_keywords:
  - "punjab national bank"
  - "pnb"
  - "punb"
  - "init sol id"

headers:
  date:
    - "txn. date"
  value_date:
    - "value date"
  description:
    - "txn. part."
  reference_number:
    - "txn. id"
  cheque_number:
    - "inst. no."
  direction:
    - "txn. type"
  amount:
    - "txn. amt."
  balance:
    - "cls. bal."

date_formats:
  - "%Y-%m-%d"
  - "%d-%m-%Y"
  - "%d/%m/%Y"

signed_amounts: false

metadata_patterns:
  account_number: '(?:Account\s*Number\s*[:\-]?\s*)([0-9]{16})'

layout_signature:
  header_row:
    expected: 14
    tolerance: 5
    bonus: 1.0
  column_count:
    expected: 15
    tolerance: 1
    bonus: 2.0
  sequence:
    expected:
      - date
      - description
      - reference_number
      - cheque_number
      - amount
      - value_date
      - balance
    weight: 3.0
