profile_id: "au_excel_fmt1"
parent_bank: "au"
bank_name: "Au Small Finance Bank Limited"
container_format: "excel"
layout_variant: "fmt1"

file_format:
  declared_extension: ".xlsx"
  actual_hidden_format: "openxml_spreadsheet (True PKZip/OpenXML package, not HTML/XML disguised as .xls)."
  mime_type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  magic_bytes: "504B0304 (PK\\x03\\x04)"

aliases:
  - "au"
  - "au small finance bank"
  - "au small finance bank limited"
  - "au bank"
  - "aubl"

identification_keywords:
  - "au"
  - "au small finance bank"
  - "au small finance bank limited"
  - "au bank"
  - "aubl"

headers:
  date:
    - "transaction date"
  posting_date:
    - "transaction posting date"
  value_date:
    - "transaction value date"
  description:
    - "transaction description"
  reference_number:
    - "transaction ref no"
    - "user referance no"
    - "user reference no"
  cheque_number:
    - "referance cheque no"
    - "reference cheque no"
  amount:
    - "transaction amount"
  direction:
    - "flag debit credit"

date_formats:
  - "%Y-%m-%d %H:%M:%S"
  - "%d-%m-%Y"
  - "%Y-%m-%d"

signed_amounts: true

metadata_patterns:
  account_number: '(?:Account\s*(?:No\.?|Number)?|A\/c\s*No\.?)\s*[:\-]?\s*([0-9A-Za-z]{9,18})'

layout_signature:
  header_row:
    expected: 1
    tolerance: 1
    bonus: 1.0
  column_count:
    expected: 16
    tolerance: 0
    bonus: 2.0
  sequence:
    expected:
      - date
      - posting_date
      - value_date
      - cheque_number
      - direction
      - amount
      - description
      - reference_number
    weight: 3.0
