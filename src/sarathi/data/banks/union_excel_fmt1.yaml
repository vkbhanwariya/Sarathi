profile_id: "union_excel_fmt1"
parent_bank: "union"
bank_name: "Union Bank of India"
container_format: "excel"
layout_variant: "fmt1"

file_format:
  declared_extension: ".xlsx"
  actual_hidden_format: "openxml_spreadsheet"
  mime_type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

aliases:
  - "union"
  - "union bank"
  - "union bank of india"
  - "corporation bank"

identification_keywords:
  - "union bank of india"
  - "union bank"
  - "corporation bank"

headers:
  reference_number:
    - "transaction id"
  date:
    - "transaction date"
  cheque_number:
    - "instrument number/utr no."
    - "instrument number/utr no"
  description:
    - "narration"
  debit:
    - "debit amount"
  credit:
    - "credit amount"
  balance:
    - "line balance"

date_formats:
  - "%d-%m-%Y"
  - "%d/%m/%Y"
  - "%Y-%m-%d"

signed_amounts: false

metadata_patterns:
  account_number: '(?:Account\s*Number\s*[:\-]?\s*)([0-9]{15})'

layout_signature:
  header_row:
    expected: 7
    tolerance: 3
    bonus: 1.0
  column_count:
    expected: 13
    tolerance: 0
    bonus: 2.0
  sequence:
    expected:
      - reference_number
      - date
      - cheque_number
      - description
      - debit
      - credit
      - balance
    weight: 3.0
