profile_id: "indian_bank_excel_fmt1"
parent_bank: "indian_bank"
bank_name: "Indian Bank"
container_format: "excel"
layout_variant: "fmt1"

file_format:
  declared_extension: ".xls"
  actual_hidden_format: "legacy_biff_spreadsheet"
  mime_type: "application/vnd.ms-excel"

aliases:
  - "indian bank"
  - "indian bank statement"

identification_keywords:
  - "indian bank"
  - "idib"
  - "host_branch"
  - "host_br_name"

headers:
  date:
    - "tran_date"
  debit:
    - "dr_amount"
  credit:
    - "cr_amount"
  description:
    - "tran_desc"
  reference_number:
    - "journal_number"
  cheque_number:
    - "instr_no"

date_formats:
  - "%Y-%m-%d"
  - "%d-%m-%Y"
  - "%d/%m/%Y"

signed_amounts: false
negative_debits: true

metadata_patterns:
  account_number: '(?:Account\s*(?:No\.?|Number)?)\s*[:\-]?\s*([0-9]{9,18})'

layout_signature:
  header_row:
    expected: 0
    tolerance: 3
    bonus: 1.0
  column_count:
    expected: 10
    tolerance: 0
    bonus: 2.0
  sequence:
    expected:
      - date
      - debit
      - credit
      - balance
      - description
      - reference_number
      - cheque_number
    weight: 3.0
