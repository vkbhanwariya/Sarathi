profile_id: "icici_excel_fmt1"
parent_bank: "icici"
bank_name: "ICICI Bank Limited"
container_format: "excel"
layout_variant: "fmt1"

file_format:
  declared_extension: ".xlsx"
  actual_hidden_format: "openxml_spreadsheet"
  mime_type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

aliases:
  - "icici"
  - "icici bank"
  - "icici bank limited"

identification_keywords:
  - "icici bank"
  - "icici bank limited"
  - "icici"
  - "icic"

headers:
  date:
    - "date_of_transaction"
  cheque_number:
    - "instrument_number"
  description:
    - "narration"
  debit:
    - "debit_amount"
  credit:
    - "credit_amount"
  balance:
    - "line_balance"

date_formats:
  - "%Y-%m-%d"
  - "%d-%m-%Y"
  - "%d/%m/%Y"

signed_amounts: false

metadata_patterns:
  account_number: '(?:Account_Number|Account\s*No)\s*[:\-]?\s*([0-9]{12,18})'

layout_signature:
  header_row:
    expected: 0
    tolerance: 0
    bonus: 1.0
  column_count:
    expected: 11
    tolerance: 0
    bonus: 2.0
  sequence:
    expected:
      - date
      - cheque_number
      - description
      - debit
      - credit
      - balance
    weight: 3.0
