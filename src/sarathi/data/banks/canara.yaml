# Canara Bank Statement Profile
profile_id: "canara"
bank_name: "Canara Bank"
aliases:
  - "canara bank"
  - "canara"

identification_keywords:
  - "canara bank"
  - "canarabank.com"
  - "canarabank.in"

headers:
  date:
    - "txn date"
    - "value date"
    - "date"
  description:
    - "particulars"
    - "description"
    - "narration"
  reference_number:
    - "chq no"
    - "cheque no"
    - "ref no"
    - "utr"
  debit:
    - "debit"
    - "withdrawal"
    - "dr"
    - "debit amt"
  credit:
    - "credit"
    - "deposit"
    - "cr"
    - "credit amt"
  balance:
    - "balance"
    - "balance (inr)"
    - "net balance"

date_formats:
  - "%d-%b-%Y"
  - "%d/%m/%Y"
  - "%d-%m-%Y"

metadata_patterns:
  account_number: '(?:Account\s*(?:Number|No\.?)?|A/c\s*No\.?)\s*[:\-]?\s*([0-9Xx\*]{13})'
  account_holder: '(?:Name|Customer\s*Name|A/c\s*Holder)\s*[:\-]?\s*([^\n]+)'
  ifsc: 'IFSC(?:\s*Code)?\s*[:\-]?\s*(CNRB0[A-Z0-9]{6})'
  cust_id: '(?:Cust\s*ID|Customer\s*ID)\s*[:\-]?\s*([0-9]{8,10})'
